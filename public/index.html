<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FREE NutriChunks or Majesty</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="brandmark" src="smf-logo.png" alt="San Miguel Foods">
    <div class="brand"><h1>FREE NutriChunks or Majesty</h1><p id="condoLine">Dog food • Cat food</p></div>
  </header>

  <main id="main" class="content">
    <div id="loading" class="statusbox">Loading…</div>
  </main>
</div>

<template id="formTpl">
  <div class="hero">
    <div class="heroTitle">Welcome, pet parent!</div>
    <div class="heroSub">Answer a few short questions (about 1 minute), then show your QR code at the booth to receive <b>FREE NutriChunks</b> (dog food) or <b>Majesty</b> (cat food) for your pet.</div>
    <div class="heroNote"><b>NOTE:</b> Available while supplies last. One free pack per mobile number.</div>
  </div>

  <section class="q" data-q="consent">
    <div class="qTitle">Data privacy</div>
    <div class="privacy">San Miguel Foods would like to collect your name, mobile number and pet details for this condo sampling program, for documentation and reporting. Access is limited to authorized program personnel, in line with the Data Privacy Act of 2012.<br><br><b>Do you agree?</b></div>
    <div class="choices two" data-name="consent">
      <button type="button" class="choice" data-v="YES">Yes, I agree</button>
      <button type="button" class="choice" data-v="NO">No</button>
    </div>
    <div id="noConsent" class="warnbox" hidden>We need your consent to register you and give you your free pack. You may change your answer at any time.</div>
  </section>

  <div id="afterConsent" hidden>
    <section class="q" data-q="petType">
      <div class="qTitle">Do you have a dog or a cat?</div>
      <div class="choices three" data-name="petType">
        <button type="button" class="choice" data-v="DOG">🐶 Dog</button>
        <button type="button" class="choice" data-v="CAT">🐱 Cat</button>
        <button type="button" class="choice" data-v="BOTH">🐶🐱 Dog &amp; Cat</button>
      </div>
    </section>

    <div id="dogPart" hidden>
      <div class="partHead">🐶 About your dog</div>
      <section class="q" data-q="dogNames">
        <div class="qTitle">Dog's name</div>
        <div class="qSub">If you have more than one, list all names (e.g. Choco, Max)</div>
        <input id="dogNames" class="big" maxlength="120" autocomplete="off" placeholder="Choco">
      </section>
      <section class="q" data-q="dogCount">
        <div class="qTitle">How many dogs do you have?</div>
        <div class="stepper" data-name="dogCount"><button type="button" class="stepBtn" data-d="-1">−</button><span class="stepValue">1</span><button type="button" class="stepBtn" data-d="1">+</button></div>
      </section>
      <section class="q" data-q="dogAge">
        <div class="qTitle">Age</div>
        <div class="choices two" data-name="dogAge">
          <button type="button" class="choice" data-v="PUPPY">Puppy (below 1 yr)</button>
          <button type="button" class="choice" data-v="ADULT">Adult (1 yr+)</button>
        </div>
      </section>
      <section class="q" data-q="dogSize">
        <div class="qTitle">Size</div>
        <div class="choices three" data-name="dogSize">
          <button type="button" class="choice" data-v="SMALL">Small<small>Shih Tzu, Pom, Chihuahua</small></button>
          <button type="button" class="choice" data-v="MEDIUM">Medium<small>Beagle, Aspin</small></button>
          <button type="button" class="choice" data-v="LARGE">Large<small>Lab, Husky</small></button>
        </div>
      </section>
      <section class="q" data-q="dogBrand">
        <div class="qTitle">Which dog food brand do you use now?</div>
        <div class="choices brands" data-name="dogBrand"></div>
        <input id="dogBrandOther" class="big" maxlength="60" placeholder="Brand name" hidden>
      </section>
    </div>

    <div id="catPart" hidden>
      <div class="partHead">🐱 About your cat</div>
      <section class="q" data-q="catNames">
        <div class="qTitle">Cat's name</div>
        <div class="qSub">If you have more than one, list all names (e.g. Mingming, Tiger)</div>
        <input id="catNames" class="big" maxlength="120" autocomplete="off" placeholder="Mingming">
      </section>
      <section class="q" data-q="catCount">
        <div class="qTitle">How many cats do you have?</div>
        <div class="stepper" data-name="catCount"><button type="button" class="stepBtn" data-d="-1">−</button><span class="stepValue">1</span><button type="button" class="stepBtn" data-d="1">+</button></div>
      </section>
      <section class="q" data-q="catAge">
        <div class="qTitle">Age</div>
        <div class="choices two" data-name="catAge">
          <button type="button" class="choice" data-v="KITTEN">Kitten (below 1 yr)</button>
          <button type="button" class="choice" data-v="ADULT">Adult (1 yr+)</button>
        </div>
      </section>
      <section class="q" data-q="catBrand">
        <div class="qTitle">Which cat food brand do you use now?</div>
        <div class="choices brands" data-name="catBrand"></div>
        <input id="catBrandOther" class="big" maxlength="60" placeholder="Brand name" hidden>
      </section>
    </div>

    <div id="youPart" hidden>
      <div class="partHead">About you</div>
      <section class="q" data-q="name">
        <div class="qTitle">Your name</div>
        <input id="name" class="big" maxlength="80" autocomplete="name" placeholder="Juan Dela Cruz">
      </section>
      <section class="q" data-q="mobile">
        <div class="qTitle">Mobile number</div>
        <div class="qSub">One free pack per mobile number</div>
        <input id="mobile" class="big" inputmode="tel" maxlength="16" autocomplete="tel" placeholder="09171234567">
        <div id="mobileHint" class="hint" hidden>Please enter 11 digits starting with 09.</div>
      </section>
      <section class="q" data-q="promo">
        <div class="qTitle">May we send you text messages about NutriChunks and Majesty promotions?</div>
        <div class="choices two" data-name="promo">
          <button type="button" class="choice" data-v="YES">Yes</button>
          <button type="button" class="choice" data-v="NO">No</button>
        </div>
      </section>

      <div id="formError" class="errbox" hidden></div>
      <button id="submit" type="button" class="btn primary huge">Get my FREE NutriChunks / Majesty</button>
    </div>
  </div>
</template>

<template id="ticketTpl">
  <div class="ticket">
    <div class="tkTop">Take a screenshot of this QR code and show it at the booth</div>
    <div class="tkCode" id="tkCode"></div>
    <div class="tkPets" id="tkPets"></div>
    <div class="tkQr" id="tkQr"></div>
    <div class="tkSamples" id="tkSamples"></div>
    <div class="tkMeta" id="tkMeta"></div>
  </div>
  <div class="helper center">Please keep this page open until you receive your free pack.</div>
  <div class="heroNote center" style="margin-top:10px"><b>NOTE:</b> Available while supplies last.</div>
</template>

<script src="vendor/qrcode.js"></script>
<script src="resident.js"></script>
</body>
</html>
